<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass-card { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.18); padding: 2rem; width: 90%; max-width: 400px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); }
        .form-control { background: rgba(255, 255, 255, 0.9); border: none; border-radius: 10px; height: 50px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="glass-card text-center text-white">
        <h3 class="fw-bold mb-3">Forgot Password</h3>
        <p class="small mb-4 opacity-75">Enter your registered email. We will send a 6-digit code to reset your password.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} p-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            <button type="submit" class="btn btn-light w-100 fw-bold py-2" style="color: #764ba2; border-radius: 10px;">Send Reset Code</button>
        </form>
        
        <div class="mt-4">
            <a href="{{ url_for('login') }}" class="text-white text-decoration-none small opacity-75">Back to Login</a>
        </div>
    </div>
</body>
</html>
