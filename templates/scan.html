<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Hub - KeyHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7fe; padding-bottom: 30px; }
        .scanner-card { background: white; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        .mode-badge { position: absolute; top: 20px; right: 20px; z-index: 10; }
        #reader { width: 100% !important; border: none !important; }
        .status-box { padding: 20px; text-align: center; border-top: 1px solid #eee; }
        /* Hidden input for External USB Scanner */
        #externalInput { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('dashboard') }}" class="btn btn-white rounded-circle shadow-sm me-3"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0">Scanner Hub</h4>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="scanner-card p-4 text-center h-100 d-flex flex-column justify-content-center">
                <div class="mb-3 text-primary"><i class="bi bi-usb-symbol display-3"></i></div>
                <h5 class="fw-bold">External Scanner</h5>
                <p class="text-muted small">The system is listening for your USB scanner. Just plug it in and scan.</p>
                <input type="text" id="externalInput" autofocus>
                <div id="usbStatus" class="badge bg-success rounded-pill p-2"><i class="bi bi-broadcast me-2"></i>Live & Listening</div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="scanner-card position-relative">
                <div id="reader"></div>
                <div class="status-box">
                    <h5 class="fw-bold mb-1">Camera Scanner</h5>
                    <div id="scanMsg"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const extInput = document.getElementById('externalInput');
    const scanMsg = document.getElementById('scanMsg');

    // --- EXTERNAL SCANNER LOGIC ---
    function keepFocus() { extInput.focus(); }
    document.addEventListener('click', keepFocus);
    setInterval(keepFocus, 1000); // Keep focused for USB scanner

    extInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            processScan(extInput.value.trim());
            extInput.value = '';
        }
    });

    // --- CAMERA SCANNER LOGIC ---
    function onScanSuccess(decodedText) {
        processScan(decodedText);
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess);

    // --- SHARED PROCESSING LOGIC ---
    function processScan(code) {
        scanMsg.innerHTML = '<div class="spinner-border spinner-border-sm text-primary"></div>';
        fetch('/scan_qr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ qr_code: code })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                scanMsg.innerHTML = `<div class="alert alert-success py-2 rounded-pill">${data.message}</div>`;
            } else {
                scanMsg.innerHTML = `<div class="alert alert-danger py-2 rounded-pill">${data.message}</div>`;
            }
        });
    }
</script>
</body>
</html>
