<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Batch Operation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .confirm-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; width: 100%; padding: 2rem; }
        .btn-confirm { background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); border: none; color: white; }
    </style>
</head>
<body>

<div class="confirm-card text-center">
    <div class="mb-4">
        <i class="bi bi-file-earmark-spreadsheet-fill text-primary" style="font-size: 4rem;"></i>
    </div>
    
    <h3 class="fw-bold mb-2">Review Batch {{ action.title() }}</h3>
    <p class="text-muted">Please confirm the details below before proceeding.</p>

    <div class="alert alert-light border text-start d-inline-block w-100">
        <div class="d-flex justify-content-between mb-2">
            <strong>Action:</strong> 
            <span class="badge {{ 'bg-success' if action == 'add' else 'bg-danger' }} rounded-pill">{{ action.upper() }} ASSETS</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <strong>Total Items:</strong> 
            <span>{{ count }} rows</span>
        </div>
        <div class="d-flex justify-content-between">
            <strong>CSV Status:</strong> 
            <span class="text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i>Valid Headers</span>
        </div>
    </div>

    <div class="table-responsive mb-4 border rounded-3">
        <table class="table table-sm table-striped mb-0 small text-start">
            <thead class="table-light">
                <tr><th>Preview Data (First 3)</th></tr>
            </thead>
            <tbody>
                {% for row in preview %}
                <tr><td class="text-truncate" style="max-width: 300px;">{{ row }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="d-flex gap-2">
        <a href="{{ url_for('add_key') }}" class="btn btn-light w-50 rounded-pill fw-bold border">Cancel</a>
        
        <form action="{{ url_for('execute_batch') }}" method="POST" class="w-50">
            <button type="submit" class="btn btn-confirm w-100 rounded-pill fw-bold">
                Confirm & Run
            </button>
        </form>
    </div>
</div>

</body>
</html>
