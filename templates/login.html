<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Manager Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* Increased padding for breathing room */
            padding: 3.5rem 2.8rem; 
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.45);
        }
        .institute-logo-login {
            width: 150px;
            height: auto;
            object-fit: contain;
            margin-bottom: 2.5rem;
            background: transparent !important;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 15px;
            height: 55px;
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }
        .btn-login {
            width: 100%;
            height: 55px;
            border-radius: 15px;
            background: #ffffff;
            color: #764ba2;
            font-weight: 600;
            border: none;
            transition: 0.3s;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-login:hover { background: #f8f9fa; }
        .btn-login:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="glass-card text-center text-white">
        <img src="{{ url_for('static', filename='logo.png') }}" class="institute-logo-login" alt="Logo">
        <h2 class="mb-2 fw-bold">Institute KeyHub</h2>
        <p class="mb-5 opacity-75">Sign in to your account</p>
        
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" class="form-control" placeholder="Username" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger p-2 small border-0 rounded-3 mb-4 text-dark" style="background: rgba(255,255,255,0.8);">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <button type="submit" class="btn btn-login">Login</button>
        </form>

        <div class="mt-5">
            <a href="{{ url_for('forgot_password') }}" class="text-white text-decoration-none small opacity-75">Forgot Password?</a>
            <br>
            <a href="{{ url_for('register') }}" class="text-white fw-bold text-decoration-none small">Create New Account</a>
        </div>
    </div>

</body>
</html>
