<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - KeyHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7fe; padding-bottom: 120px; }
        .sidebar { height: 100vh; background: white; width: 260px; position: fixed; top: 0; left: 0; padding-top: 2rem; z-index: 1000; box-shadow: 4px 0 15px rgba(0,0,0,0.03); }
        .main-content { margin-left: 260px; padding: 2rem; }
        .header-bg { background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); border-radius: 25px; color: white; padding: 3rem 1.5rem; margin-bottom: 2rem; text-align: center; }
        .avatar-circle { width: 90px; height: 90px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2.5rem; color: white; border: 3px solid rgba(255,255,255,0.4); }
        .card-custom { border: none; border-radius: 20px; background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .bottom-nav { position: fixed; bottom: 20px; left: 15px; right: 15px; background: white; border-radius: 25px; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 2000; box-shadow: 0 15px 35px rgba(0,0,0,0.15); padding: 0 10px; }
        .nav-icon-btn { color: #b0b0b0; text-decoration: none; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; flex: 1; }
        .nav-icon-btn.active { color: #764ba2; font-weight: 600; }
        .scanner-center-wrapper { position: relative; top: -30px; background: #f4f7fe; padding: 10px; border-radius: 50%; }
        .scanner-btn { width: 65px; height: 65px; background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.8rem; box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4); border: 5px solid white; }
        @media (max-width: 991px) { .sidebar { display: none !important; } .main-content { margin-left: 0; padding: 1.2rem; } }
    </style>
</head>
<body>
    <div class="sidebar d-none d-lg-block">
        <div class="px-4 mb-5"><h3 class="fw-bold" style="color: #764ba2;">KeyHub</h3></div>
        <div class="list-group list-group-flush">
            <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action border-0 px-4 py-3"><i class="bi bi-house-door me-3"></i> Home</a>
            <a href="{{ url_for('logout') }}" class="list-group-item list-group-item-action border-0 text-danger px-4 py-3 mt-4"><i class="bi bi-box-arrow-left me-3"></i> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header-bg">
            <div class="avatar-circle"><i class="bi bi-person"></i></div>
            <h3 class="fw-bold mb-0">{{ current_user.username }}</h3>
            <p class="mb-0 opacity-75">{{ current_user.email }}</p>
        </div>

        <div class="card-custom p-4 mb-4">
            <h6 class="fw-bold mb-3">Security Settings</h6>
            <form action="{{ url_for('profile') }}" method="POST">
                <div class="input-group">
                    <input type="password" name="password" class="form-control rounded-start-pill" placeholder="New Password">
                    <button class="btn btn-primary rounded-end-pill">Update</button>
                </div>
            </form>
        </div>
    </div>

    <div class="bottom-nav d-lg-none">
        <a href="{{ url_for('dashboard') }}" class="nav-icon-btn"><i class="bi bi-house-door fs-4"></i><span>Home</span></a>
        <a href="{{ url_for('active_keys') }}" class="nav-icon-btn"><i class="bi bi-list-check fs-4"></i><span>Activity</span></a>
        {% if current_user.role == 'admin' %}
        <div class="scanner-center-wrapper"><a href="{{ url_for('scan_page') }}" class="scanner-btn"><i class="bi bi-qr-code-scan"></i></a></div>
        {% else %}
        <div class="nav-icon-btn opacity-25" style="pointer-events: none;"><i class="bi bi-shield-lock fs-4"></i><span>Secure</span></div>
        {% endif %}
        <a href="{{ url_for('profile') }}" class="nav-icon-btn active"><i class="bi bi-person-fill fs-4"></i><span>Profile</span></a>
        <a href="{{ url_for('logout') }}" class="nav-icon-btn"><i class="bi bi-box-arrow-right fs-4"></i><span>Exit</span></a>
    </div>
</body>
</html>
