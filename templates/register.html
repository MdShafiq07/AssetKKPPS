<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KeyHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* Increased padding to prevent a "packed" look */
            padding: 3rem 2.5rem; 
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.45);
        }
        .institute-logo-register {
            width: 130px;
            height: auto;
            object-fit: contain;
            margin-bottom: 2rem;
            background: transparent !important;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 15px;
            height: 52px;
            margin-bottom: 1.2rem;
            padding-left: 1.5rem;
        }
        .btn-register {
            width: 100%;
            height: 55px;
            border-radius: 15px;
            background: #ffffff;
            color: #764ba2;
            font-weight: 600;
            border: none;
            transition: 0.3s;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-register:hover { background: #f8f9fa; }
        .btn-register:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="glass-card text-center text-white">
        <img src="{{ url_for('static', filename='logo.png') }}" class="institute-logo-register" alt="Logo">
        <h2 class="mb-2 fw-bold">Join KeyHub</h2>
        <p class="mb-4 opacity-75">Create an account</p>
        
        <form method="POST">
            <input type="text" name="username" class="form-control" placeholder="Username (e.g. Ali)" required>
            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-warning p-2 small border-0 rounded-3 mb-3">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <button type="submit" class="btn btn-register">Sign Up</button>
        </form>
        
        <div class="mt-5">
            <a href="{{ url_for('login') }}" class="text-white text-decoration-none small opacity-75">Already have an account? Login</a>
        </div>
    </div>

</body>
</html>
